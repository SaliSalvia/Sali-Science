name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (package manager of record - uses bun.lock)
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js (runtime for tsc/tsx/vite)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
